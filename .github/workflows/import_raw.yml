# This workflow copies the raw TRACE dataset into this repository so the analysis remains independent.
name: Import raw TRACE dataset

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import_raw.yml"

permissions:
  contents: write

concurrency:
  group: import-raw-trace
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/aether0xff-afk/EmoNet_working.git
  SOURCE_REF: 46eb47cc3182b6d872e8f976496cc81eac56adcb
  SOURCE_PATH: v4/outputs/research/trajectory_batch_matrix120_v1

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout isThereEmotion
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare Git LFS
        run: |
          git lfs install
          git lfs env

      - name: Sparse-clone source TRACE directory
        shell: bash
        run: |
          rm -rf /tmp/emonet
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse "$SOURCE_REPO" /tmp/emonet
          cd /tmp/emonet
          git sparse-checkout set "$SOURCE_PATH"
          git checkout "$SOURCE_REF"
          git lfs pull --include="$SOURCE_PATH/**/raw_trace.json" --exclude=""

      - name: Copy raw_trace.json files into this repository
        shell: bash
        run: |
          rm -rf data/raw
          mkdir -p data/raw

          count=0
          while IFS= read -r -d '' file; do
            sample="$(basename "$(dirname "$file")")"
            mkdir -p "data/raw/$sample"
            cp "$file" "data/raw/$sample/raw_trace.json"
            count=$((count + 1))
          done < <(find "/tmp/emonet/$SOURCE_PATH" -mindepth 2 -maxdepth 2 -type f -name raw_trace.json -print0 | sort -z)

          echo "copied raw TRACE files: $count"
          if [ "$count" -eq 0 ]; then
            echo "No raw_trace.json files were copied." >&2
            exit 1
          fi

          printf "%s\n" "$SOURCE_REF" > data/SOURCE_COMMIT.txt

      - name: Validate JSON and write source manifest
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          rows = []
          files = sorted(Path("data/raw").glob("*/raw_trace.json"))
          for path in files:
              payload = path.read_bytes()
              obj = json.loads(payload)
              meta = obj.get("input_meta") or {}
              rows.append({
                  "sample_id": meta.get("sample_id") or path.parent.name,
                  "label": meta.get("label"),
                  "talk_id": meta.get("talk_id"),
                  "persona_id": meta.get("persona_id"),
                  "profile_id": meta.get("profile_id"),
                  "bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
                  "path": path.as_posix(),
              })

          if not rows:
              raise SystemExit("No valid raw TRACE files found")

          with open("data/source_manifest.csv", "w", newline="", encoding="utf-8-sig") as f:
              writer = csv.DictWriter(f, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)

          print(f"validated JSON files: {len(rows)}")
          print(f"total raw bytes: {sum(r['bytes'] for r in rows):,}")
          PY

      - name: Build processed feature table
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
          python scripts/01_build_features.py

      - name: Commit imported dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw data/processed/features.csv data/source_manifest.csv data/SOURCE_COMMIT.txt

          if git diff --cached --quiet; then
            echo "Dataset is already up to date."
            exit 0
          fi

          git commit -m "data: import independent raw EmoNet TRACE dataset"
          git push origin HEAD:main
