name: Build single analysis notebook

on:
  push:
    paths:
      - ".notebook-build-trigger"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Build and validate notebook
        run: python build_notebook.py

      - name: Remove old and temporary code
        shell: bash
        run: |
          rm -rf scripts notebook_parts
          rm -f build_notebook.py
          rm -f .github/workflows/import_raw.yml
          rm -f .github/workflows/build_notebook.yml
          rm -f .notebook-build-trigger
          rm -f data/processed/features.csv
          printf 'numpy\npandas\n' > requirements.txt

      - name: Commit single-notebook structure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate analysis into one notebook"
          git push origin HEAD:main
